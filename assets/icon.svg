<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Campaign Monitor MCP">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Megaphone (white), tilted for a dynamic "announcement" feel -->
  <g transform="rotate(-15 256 256)" fill="#FFFFFF">
    <!-- Back cap -->
    <rect x="150" y="236" width="34" height="40" rx="12"/>
    <!-- Horn / cone -->
    <path d="M178 230 L320 184 Q332 180 332 196 L332 316 Q332 332 320 328 L178 282 Z"/>
    <!-- Handle -->
    <rect x="196" y="278" width="26" height="58" rx="13"/>
  </g>

  <!-- Sound waves -->
  <g transform="rotate(-15 256 256)" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.92">
    <path d="M356 214 Q386 256 356 298"/>
    <path d="M384 192 Q428 256 384 320"/>
  </g>
</svg>
